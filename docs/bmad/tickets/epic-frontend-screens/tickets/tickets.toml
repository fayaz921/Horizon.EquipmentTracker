id = 3
type = "story"
title = "Morning Checkout Modal Component"
description = "Implement CheckoutModal.tsx offering under 15-second flow: staff dropdown with auto LoggedBy defaulting, sample kit template selector (pre-filling each line with the next available unit of that type, omitting unavailable types with a clear notice while allowing checkout to proceed), multi-line equipment picker, return date buttons (Today, Tomorrow, Custom in PKT), and inline 409 conflict surfacing; strictly no demo PINs in UI."
verify = "Surveyor completes checkout under 15 seconds; selecting a kit pre-fills next available units and cleanly handles unavailable units without blocking; concurrent conflict surfaces inline error."
