# Epic 2: Checkout and Return

[[entry]]
id = 1
type = "story"
title = "Personnel Roster & Equipment Availability Query Endpoints"
description = "Build thin PersonnelController and EquipmentController delegating to PersonnelService and EquipmentService; implement GET /api/personnel returning active personnel roster in alphabetical order, and GET /api/equipment returning serialized equipment availability status and counted inventory pool totals; build response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/."
verify = "Calling GET /api/personnel and GET /api/equipment invokes PersonnelService and EquipmentService, returning mapped DTOs with accurate availability counts without exposing domain entities."
covers = ["FR-1", "FR-5", "FR-6", "AD-11"]
after = []
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]

[[entry]]
id = 2
type = "story"
title = "Survey Kit Templates API"
description = "Build thin KitsController (or EquipmentController action) delegating to KitService (or CheckoutService); implement GET /api/kits endpoint returning sample demonstration kit templates (labelled as sample data, e.g. 'Sample: Standard Total Station Kit' and 'Sample: GPS RTK Rover Kit') to pre-populate multi-line checkout drafts; build survey kit response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/."
verify = "GET /api/kits invokes service and returns mapped DTOs of kits clearly labelled as sample data with deserialized item configurations without exposing domain entities."
covers = ["FR-3", "AD-11"]
after = [1]
hitl = false
risk = "low"
notes = ["Scope: Should-Have"]

[[entry]]
id = 3
type = "story"
title = "Multi-Line Checkout Endpoint with Dual Attribution & Concurrency Protection"
description = "Build thin CheckoutsController with POST /api/checkouts delegating to CheckoutService; implement CheckoutService containing business logic to validate availability, enforce dual attribution, update serialized equipment status to Out, decrement counted inventory pools, and handle DbUpdateConcurrencyException returning HTTP 409; build checkout request and response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/."
verify = "Submitting valid checkout request DTO persists CheckoutEvent and CheckoutLines via CheckoutService, transitions assets to Out, decrements bulk counts, and returns mapped response DTO; concurrent conflicts return 409 ProblemDetails."
covers = ["FR-1", "FR-2", "FR-4", "FR-7", "AD-3", "AD-4", "AD-11"]
after = [1]
hitl = false
risk = "medium"
notes = ["Scope: Must-Have"]

[[entry]]
id = 4
type = "story"
title = "Active Custody Query Endpoint"
description = "Implement GET /api/checkouts/active in CheckoutsController delegating to CheckoutService; CheckoutService queries open checkout lines directly from DbContext with recipient details, expected return dates, item details, and held quantities; build active custody response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/."
verify = "GET /api/checkouts/active via CheckoutsController invokes CheckoutService, returning mapped active custody DTOs for all unclosed checkout lines with populated staff and equipment names without exposing domain entities."
covers = ["FR-5", "FR-8", "AD-11"]
after = [3]
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]

[[entry]]
id = 5
type = "story"
title = "Per-Line Return Endpoint"
description = "Build thin ReturnsController with POST /api/returns/{lineId} delegating to ReturnService; implement ReturnService encapsulating business rules to close individual checkout lines, record ActualReturnTimestamp, restore serialized assets to Available, and handle partial quantity returns for counted inventory directly on DbContext; build return request and response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/."
verify = "Returning a line via ReturnsController invokes ReturnService, marks line closed, sets ActualReturnTimestamp, restores serialized item to Available, increments counted pool, and returns mapped return response DTO."
covers = ["FR-8", "AD-3", "AD-7", "AD-11"]
after = [4]
hitl = false
risk = "medium"
notes = ["Scope: Must-Have"]
