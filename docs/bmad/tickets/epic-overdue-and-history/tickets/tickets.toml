# Epic 4: Overdue and History

[[entry]]
id = 1
type = "story"
title = "PKT Delinquency Evaluator & Due Date Status Service"
description = "Implement DateTimeExtensions and overdue domain logic within CheckoutService / EquipmentService calculating Due Today and Overdue status strictly against Pakistan Standard Time (PKT, UTC+05:00); overdue begins at 00:00 PKT following ExpectedReturnDate; enrich active checkout response DTOs in Dtos/ via hand-written mapping extension methods in Mapping/ with status badges and days delinquent."
verify = "Active checkout response DTOs enriched via mapping extension methods accurately evaluate items due yesterday as Overdue with correct day count and items due today as Due Today based on PKT."
covers = ["FR-14", "AD-2", "AD-8", "AD-11"]
after = []
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]

[[entry]]
id = 2
type = "story"
title = "Due Date Extension Endpoint with Delinquency Gate & Audit Log"
description = "Implement POST /api/checkouts/{lineId}/extend in CheckoutsController delegating to CheckoutService; CheckoutService contains domain rules permitting self-extension before due date midnight in PKT, requiring Admin PIN once overdue, and appending immutable records to DueDateExtensionLog directly via DbContext; build extension request and response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/."
verify = "Calling extension endpoint on CheckoutsController invokes CheckoutService; self-extension succeeds on non-overdue line; overdue line rejects without Admin PIN and succeeds with Admin PIN; records DueDateExtensionLog and returns mapped extension response DTO."
covers = ["FR-16", "AD-6", "AD-8", "AD-11"]
after = [1]
hitl = false
risk = "medium"
notes = ["Scope: Should-Have"]

[[entry]]
id = 3
type = "story"
title = "WhatsApp Reminder Link DTO & Pakistani Phone Formatter"
description = "Implement Pakistani phone formatting utility; integrate with checkout response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/ to format local Pakistani numbers (0300...) to international digits (92300...) and generate standardized pre-encoded wa.me reminder message URLs for Due Today and Overdue checkout lines."
verify = "Active checkout response DTOs mapped via extension methods contain correctly formatted recipient phone numbers and URL-encoded wa.me reminder links matching delinquency status."
covers = ["FR-15", "AD-9", "AD-11"]
after = [1]
hitl = false
risk = "low"
notes = ["Scope: Should-Have"]

[[entry]]
id = 4
type = "story"
title = "Historical Custody Query Endpoint with Interval Overlap"
description = "Build thin HistoryController with GET /api/history delegating to HistoryService; HistoryService queries DbContext directly with interval overlap calculation [T_checkout, T_return] against query window presets ('this-month', 'last-month', custom 'from'/'to'), PersonId, and EquipmentId, treating open checkouts as extending to current timestamp; build history request and response DTOs in Dtos/ and hand-written mapping extension methods in Mapping/."
verify = "GET /api/history via HistoryController invokes HistoryService, returning mapped custody history DTOs accurately overlapping the selected date range and filters without exposing domain entities."
covers = ["FR-17", "FR-18", "AD-2", "AD-11"]
after = []
hitl = false
risk = "medium"
notes = ["Scope: Must-Have"]
