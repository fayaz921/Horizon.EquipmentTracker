# Epic 5: Admin

[[entry]]
id = 1
type = "story"
title = "Admin PIN Header Authorization Filter"
description = "Implement AdminAuthorizationFilter / middleware validating X-Admin-PIN header against SHA-256 hash of configured Admin PIN ('9999' in appsettings.json); returns HTTP 401 Unauthorized with ProblemDetails on missing or incorrect PIN."
verify = "Requests to admin endpoints without header or with wrong PIN return 401; valid PIN executes endpoint."
covers = ["FR-19", "AD-6"]
after = []
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]

[[entry]]
id = 2
type = "story"
title = "Mark Asset Lost Endpoint"
description = "Implement POST /api/admin/equipment/{id}/mark-lost secured by Admin PIN; transitions asset from Available, Out, or NeedsInspection to permanent Lost state, closing open checkout line if applicable."
verify = "Asset transitions to Lost, is locked from checkout, and its open checkout line is closed."
covers = ["FR-21", "AD-6"]
after = [1]
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]

[[entry]]
id = 3
type = "story"
title = "Personnel Catalog Administration Endpoints"
description = "Implement POST /api/admin/personnel, PUT /api/admin/personnel/{id}, and DELETE /api/admin/personnel/{id} (soft-delete IsActive = false; blocks hard delete if linked to history); secured by Admin PIN."
verify = "Admin can add, update, and deactivate personnel; deactivated staff disappear from checkout roster."
covers = ["FR-22", "AD-6"]
after = [1]
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]

[[entry]]
id = 4
type = "story"
title = "Equipment Catalog & Counted Inventory Administration"
description = "Implement POST /api/admin/equipment, PUT /api/admin/equipment/{id} (update details, toggle RequiresApproval, change ApproverId, adjust counted inventory totals), and DELETE /api/admin/equipment/{id} (soft-delete IsActive = false); secured by Admin PIN."
verify = "Admin can adjust equipment details and toggle RequiresApproval; soft-deleted gear disappears from checkout."
covers = ["FR-11", "FR-22", "AD-6"]
after = [1]
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]
