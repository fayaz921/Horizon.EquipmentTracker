# Epic 4: Overdue and History

[[entry]]
id = 1
type = "story"
title = "PKT Delinquency Evaluator & Due Date Status Service"
description = "Implement DateTimeExtensions logic calculating Due Today and Overdue status strictly against Pakistan Standard Time (PKT, UTC+05:00); overdue begins at 00:00 PKT following ExpectedReturnDate; enriches active checkout responses with status badges and days delinquent."
verify = "Items due yesterday evaluate to Overdue with correct day count; items due today evaluate to Due Today."
covers = ["FR-14", "AD-2", "AD-8"]
after = []
hitl = false
risk = "low"
notes = ["Scope: Must-Have"]

[[entry]]
id = 2
type = "story"
title = "Due Date Extension Endpoint with Delinquency Gate & Audit Log"
description = "Implement POST /api/checkouts/{lineId}/extend permitting self-extension before due date midnight in PKT, requiring Admin PIN header X-Admin-PIN once overdue, and writing immutable record to DueDateExtensionLog with cumulative extension count."
verify = "Self-extension succeeds on non-overdue line; overdue line rejects without Admin PIN and succeeds with Admin PIN; DueDateExtensionLog records entry."
covers = ["FR-16", "AD-6", "AD-8"]
after = [1]
hitl = false
risk = "medium"
notes = ["Scope: Should-Have"]

